name: Jetscale Atlantis Release

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Jetscale Atlantis Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ci:
    name: "Gate: Validate CI Status"
    runs-on: namespace-profile-jetscale-validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual image publishing must be dispatched from main." >&2
            exit 1
          fi

      - run: echo "CI gate passed."

  release:
    needs: [check-ci]
    runs-on: namespace-profile-jetscale-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build --target atlantis -t atlantis-test .
          docker run --rm --entrypoint aws atlantis-test --version
          docker run --rm --entrypoint atlantis atlantis-test version
          docker run --rm --entrypoint /usr/bin/which atlantis-test aws

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Semantic Release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve image version and tags
        id: image
        env:
          RELEASE_VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            IMAGE_VERSION="$RELEASE_VERSION"
            VERSION_TAG="$RELEASE_VERSION"
          else
            IMAGE_VERSION="$(git describe --tags --abbrev=0)"
            VERSION_TAG=""
          fi

          echo "version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Atlantis version from Dockerfile
        id: atlantis
        run: |
          ATLANTIS_VERSION=$(grep -oP 'ARG ATLANTIS_VERSION=\K[^\s]+' Dockerfile)
          echo "version=${ATLANTIS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        env:
          VERSION: ${{ steps.image.outputs.version }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          ATLANTIS_VERSION: ${{ steps.atlantis.outputs.version }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${OWNER_LC}/atlantis"
          TAG_ARGS=(--tag "${IMAGE}:latest" --tag "${IMAGE}:sha-${SHA_SHORT}")

          if [[ -n "${VERSION_TAG}" ]]; then
            TAG_ARGS+=(--tag "${IMAGE}:${VERSION_TAG}")
          fi

          docker buildx build \
            --file ./Dockerfile \
            --target atlantis \
            --build-arg "ATLANTIS_VERSION=${ATLANTIS_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.base.name=ghcr.io/runatlantis/atlantis:${ATLANTIS_VERSION}" \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            "${TAG_ARGS[@]}" \
            .
