name: Jetscale Atlantis Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: namespace-profile-jetscale-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --target atlantis -t atlantis-test .

      - name: Verify AWS CLI
        run: docker run --rm --entrypoint aws atlantis-test --version

      - name: Verify Atlantis
        run: docker run --rm --entrypoint atlantis atlantis-test version

      - name: Verify aws binary path
        run: docker run --rm --entrypoint /usr/bin/which atlantis-test aws

      - name: Verify Google Cloud CLI
        run: |
          docker run --rm --entrypoint id atlantis-test
          docker run --rm --entrypoint gcloud atlantis-test version
          docker run --rm --entrypoint gcloud atlantis-test config get-value core/disable_usage_reporting
          docker run --rm --entrypoint gcloud atlantis-test config get-value component_manager/disable_update_check
          docker run --rm --entrypoint gcloud atlantis-test compute ssh --help
          docker run --rm --entrypoint gcloud atlantis-test container clusters describe --help
          docker run --rm --entrypoint gke-gcloud-auth-plugin atlantis-test --version
          docker run --rm --entrypoint setsid atlantis-test --version
          docker run --rm --entrypoint pkill atlantis-test -V
          docker run --rm --entrypoint ssh atlantis-test -V
          docker run --rm --entrypoint sha256sum atlantis-test --version
